<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BM Cân Xe Tự Động</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#2a0a12;--fg:#f6eee6;--card:#3c1018;--muted:#c9b4ad;--line:#6b2a34;--gold:#d4af37;--plate:#e8c547;--wine:#b42333;--ok:#8fbf90;--warn:#e4c56a;--bad:#e07070}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100dvh;background:radial-gradient(1200px 600px at 10% -10%,#5a1420 0%,var(--bg) 55%);color:var(--fg);font-family:"Be Vietnam Pro",system-ui,sans-serif}
    h1,h2,.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;margin:0;letter-spacing:.02em}
    .wrap{max-width:1080px;margin:0 auto;padding:22px 16px 88px}
    .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}
    .sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .grid{display:grid;gap:12px}
    @media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
    input,select,button,textarea{font:inherit;border-radius:12px;border:1px solid var(--line);background:#4a1820;color:var(--fg);padding:11px 12px;min-height:44px}
    button{cursor:pointer;background:var(--wine);color:#fff7f2;font-weight:600;border:0}
    button.gold{background:var(--gold);color:#2a0a12}
    button.ghost{background:#4a1820;color:var(--fg);border:1px solid var(--line)}
    nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
    nav.tabs button{background:#4a1820;color:var(--muted)}
    nav.tabs button.on{background:var(--wine);color:#fff7f2}
    .num{font-size:40px;color:var(--plate)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
    .lock{max-width:420px;margin:12vh auto}
    .err{color:var(--bad);font-size:13px}
    .ok{color:var(--ok)}
    .warn{color:var(--warn)}
    label{display:grid;gap:6px;font-size:12px;color:var(--muted)}
    .chip{padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:#4a1820;cursor:pointer;font-size:13px}
    .chip.on{border-color:var(--gold);color:var(--gold)}
    .kpi b{display:block;font-size:28px;font-family:"Barlow Condensed",sans-serif}
    .kpi{flex:1;min-width:120px}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    var KEY = "BinhMinh-CanXe";
    var CARGO = [
      ["cu_mi_tuoi","Củ mì tươi nguyên liệu"],
      ["bot_khoai_mi","Bột khoai mì thành phẩm"],
      ["ba_mi_say","Bã mì sấy phụ phẩm"],
      ["vo_lua","Vỏ lụa rửa củ"],
      ["hom_re","Hom rễ củ mì"],
      ["dat_lua","Đất lụa mì"],
      ["bun_vi_sinh","Bùn vi sinh"],
      ["bao_thanh_pham","Bao thành phẩm"],
      ["dau_nhot","Dầu nhớt"],
      ["can_thue","Dịch vụ cân thuê"],
      ["khac","Khác"]
    ];
    var BAGS = [
      {id:"10", n:10, t:0.08},
      {id:"20", n:20, t:0.12},
      {id:"25", n:25, t:0.15},
      {id:"50", n:50, t:0.22},
      {id:"850g", n:0.85, t:0.012}
    ];
    var IMP = ["Củ nhỏ","Nhiều rác","Nhiều rễ","Củ úng","Có nước","Có mốc"];
    var STORE = "bm-canxe-v4";
    function load() {
      try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
    }
    var saved = load();
    var S = saved || {
      unlocked: sessionStorage.getItem("bm-ok") === KEY,
      err: false,
      tab: "can",
      plate: "",
      front: "",
      rear: "",
      conf: 0,
      dir: "IN",
      kg: 0,
      cargo: "cu_mi_tuoi",
      driver: "",
      owner: "",
      bags: 40,
      bagType: "50",
      starch: 27.6,
      imp: [0,0,0,0,0,0],
      dsig: "",
      osig: "",
      qplate: "",
      vehicles: {
        "51C-248.19": {driver:"Nguyễn Văn Tám", owner:"Cty Minh", cargo:"cu_mi_tuoi"},
        "60C-127.88": {driver:"Trần Thị Loan", owner:"HTX Đông", cargo:"bot_khoai_mi"}
      },
      sessions: []
    };
    S.unlocked = sessionStorage.getItem("bm-ok") === KEY;
    function persist() {
      try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
    }
    function cargoName(id) {
      for (var i=0;i<CARGO.length;i++) if (CARGO[i][0]===id) return CARGO[i][1];
      return id;
    }
    function matchConf() {
      var f = (S.front||"").replace(/\s/g,"").toUpperCase();
      var r = (S.rear||"").replace(/\s/g,"").toUpperCase();
      if (f && r && f===r) return 99;
      if (f && r) return 72;
      if (f || r) return 88;
      return 0;
    }
    function bagMath() {
      var b = BAGS.filter(function(x){return x.id===S.bagType})[0] || BAGS[3];
      var n = Number(S.bags)||0;
      return { expected: n*b.n, tare: n*b.t, net: Math.max(0, S.kg - n*b.t) };
    }
    function csvEscape(v) {
      var s = String(v==null?"":v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }
    function exportCsv() {
      var head = "thoi_gian,bien_so,tai_xe,chu_xe,huong,loai_hang,kg_can,kg_tru_bi,lech_kg,tin_cay,diem_tinh_bot,tru_tap_chat";
      var rows = S.sessions.map(function(x){
        return [x.t,x.p,x.driver,x.owner,x.d,x.cargo,x.kg,x.net||x.kg,x.delta||0,x.conf,x.starch||"",x.imp||""].map(csvEscape).join(",");
      });
      var blob = new Blob(["\ufeff"+head+"\n"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bm-can-xe-ngay.csv";
      a.click();
    }
    function tons(dir) {
      return (S.sessions.filter(function(x){return x.d===dir}).reduce(function(a,x){return a+x.kg;},0)/1000).toFixed(1);
    }
    function known() { return S.vehicles[(S.plate||"").toUpperCase()]; }
    function applyKnown() {
      var v = known();
      if (v) { S.driver=v.driver; S.owner=v.owner; S.cargo=v.cargo; }
    }
    function el(html) {
      var d = document.createElement("div");
      d.innerHTML = html;
      return d;
    }
    function render() {
      persist();
      var root = document.getElementById("app");
      if (!S.unlocked) {
        root.innerHTML = '<div class="wrap lock"><p class="kicker">Bình Minh</p><h1 style="font-size:48px;margin-top:6px">Mã trạm</h1><p class="sub">canxe.redtigerhead.com — nhập secret trước khi vào bàn cân.</p><form class="card" style="margin-top:20px;display:grid;gap:10px" id="lock"><input type="password" autocomplete="off" placeholder="Secret key" id="pin"><p class="'+(S.err?"err":"sub")+'">'+(S.err?"Sai mã trạm.":"Bản thử: BinhMinh-CanXe — đổi STATION_KEY trên Cloudflare.")+'</p><button type="submit">Vào trạm</button></form></div>';
        document.getElementById("lock").onsubmit = function(e){
          e.preventDefault();
          var v = document.getElementById("pin").value.trim();
          if (v!==KEY){ S.err=true; render(); return; }
          sessionStorage.setItem("bm-ok", KEY);
          S.unlocked=true; render();
        };
        return;
      }
      S.conf = matchConf();
      root.innerHTML = '<div class="wrap"><p class="kicker">Bình Minh · tinh bột khoai mì</p><h1 style="font-size:42px">BM Cân Xe Tự Động</h1><p class="sub">Chụp hình, lưu biển số và cân nặng tự động — Dark Red Wine / Porcelain White / Gold.</p><nav class="tabs"><button data-t="can">Cân xe</button><button data-t="cam">Camera</button><button data-t="q">Thử mẫu</button><button data-t="r">Sổ ngày</button></nav><div id="desk"></div></div>';
      root.querySelectorAll("nav button").forEach(function(b){
        if (b.getAttribute("data-t")===S.tab) b.className="on";
        b.onclick=function(){ S.tab=b.getAttribute("data-t"); render(); };
      });
      var desk = document.getElementById("desk");
      if (S.tab==="can") deskCan(desk);
      else if (S.tab==="cam") deskCam(desk);
      else if (S.tab==="q") deskQ(desk);
      else deskDay(desk);
    }
    function deskCan(desk) {
      var m = bagMath();
      var flour = S.cargo==="bot_khoai_mi" || S.cargo==="bao_thanh_pham";
      var opts = CARGO.map(function(c){ return "<option value='"+c[0]+"'"+(S.cargo===c[0]?" selected":"")+">"+c[1]+"</option>"; }).join("");
      var bagOpts = BAGS.map(function(b){ return "<option value='"+b.id+"'"+(S.bagType===b.id?" selected":"")+">"+b.id+" kg</option>"; }).join("");
      var need = S.conf>0 && S.conf<95;
      var isNew = S.plate && !known();
      desk.innerHTML = '<div class="grid two">'+
        '<div class="card"><p class="kicker">Biển số</p><div class="num">'+(S.plate||"—")+'</div>'+
        '<p class="'+(need?"warn":"ok")+'">Tin cậy '+S.conf+'%'+(need?" — dưới 95%, xác nhận tay":" — cam trước/sau khớp")+'</p>'+
        '<div class="grid" style="margin-top:10px"><label>Cam trước<input id="f" value="'+S.front+'"></label><label>Cam sau<input id="r" value="'+S.rear+'"></label></div></div>'+
        '<div class="card"><p class="kicker">Cân · chờ 2 giây ổn định</p><div class="num" id="kg">'+(S.kg?S.kg.toLocaleString("vi-VN")+" kg":"—")+'</div>'+
        '<div class="row" style="margin-top:10px"><button class="ghost" id="settle">Xe lên bàn · ổn định</button><button class="ghost" id="dir">'+S.dir+'</button></div></div></div>'+
        '<div class="card" style="margin-top:12px"><div class="grid two">'+
        '<label>Loại hàng<select id="cg">'+opts+'</select></label>'+
        '<label>Tài xế<input id="dr" value="'+S.driver+'" placeholder="'+(isNew?"Xe mới — nhập tên":"")+' "></label>'+
        '<label>Chủ xe<input id="ow" value="'+S.owner+'"></label>'+
        (flour?('<label>Loại bao<select id="bt">'+bagOpts+'</select></label><label>Số bao<input id="bn" type="number" value="'+S.bags+'"></label><p class="sub">Kỳ vọng '+m.expected.toFixed(1)+' kg · trừ bì '+m.tare.toFixed(2)+' kg · thực '+m.net.toFixed(1)+' kg · lệch '+(S.kg-m.expected-m.tare).toFixed(1)+' kg</p>'):'<p class="sub">Củ mì: thử mẫu gán điểm sau. Xe cũ nhớ loại hàng.</p>')+
        '</div><button class="gold" id="ok" style="margin-top:12px">Xác nhận & ghi sổ</button></div>';
      function readFields(){
        S.front=document.getElementById("f").value.trim();
        S.rear=document.getElementById("r").value.trim();
        S.plate=(S.front||S.rear).toUpperCase();
        S.driver=document.getElementById("dr").value;
        S.owner=document.getElementById("ow").value;
        S.cargo=document.getElementById("cg").value;
        var bt=document.getElementById("bt"); if(bt) S.bagType=bt.value;
        var bn=document.getElementById("bn"); if(bn) S.bags=Number(bn.value)||0;
      }
      document.getElementById("f").onblur=document.getElementById("r").onblur=function(){ readFields(); applyKnown(); render(); };
      document.getElementById("cg").onchange=function(){ S.cargo=this.value; render(); };
      document.getElementById("dir").onclick=function(){ S.dir=S.dir==="IN"?"OUT":"IN"; render(); };
      document.getElementById("settle").onclick=function(){
        var btn=this; btn.textContent="Đang ổn định…";
        setTimeout(function(){ S.kg=Math.round((8+Math.random()*22)*10)*100; render(); }, 2000);
      };
      document.getElementById("ok").onclick=function(){
        readFields();
        if(!S.plate){ alert("Cần biển số."); return; }
        if(S.conf<95 && !confirm("Tin cậy "+S.conf+"% (<95%). Xác nhận thủ công?")) return;
        if(isNew && (!S.driver||!S.owner)){ alert("Xe mới: nhập tài xế và chủ xe."); return; }
        var m2=bagMath();
        S.vehicles[S.plate]={driver:S.driver,owner:S.owner,cargo:S.cargo};
        S.sessions.unshift({t:new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}),p:S.plate,d:S.dir,kg:S.kg,net:flour?m2.net:S.kg,delta:flour?(S.kg-m2.expected-m2.tare):0,conf:S.conf,cargo:cargoName(S.cargo),driver:S.driver,owner:S.owner,starch:"",imp:""});
        alert("Đã ghi "+S.plate+" · "+S.dir+" · "+S.kg+" kg");
        render();
      };
    }
    function deskCam(desk){
      desk.innerHTML='<div class="grid two"><div class="card"><p class="kicker">Cam trước</p><p class="sub">Tự chụp khi cân ổn định 2 giây. JPEG xám, cạnh 640px. Nét thấp → chụp lại.</p><input id="f2" value="'+S.front+'" placeholder="Biển cam trước"></div><div class="card"><p class="kicker">Cam sau</p><p class="sub">Khớp với trước mới ≥95%. Lệch → pending. Xe máy cày: biển giấy.</p><input id="r2" value="'+S.rear+'" placeholder="Biển cam sau"></div></div><button class="gold" id="sync" style="margin-top:12px">Đối chiếu & đưa vào đơn</button>';
      document.getElementById("sync").onclick=function(){
        S.front=document.getElementById("f2").value.trim();
        S.rear=document.getElementById("r2").value.trim();
        S.plate=(S.front||S.rear).toUpperCase();
        applyKnown(); S.tab="can"; render();
      };
    }
    function deskQ(desk){
      var ins = S.sessions.filter(function(x){return x.d==="IN" && /Củ mì/.test(x.cargo);});
      var chips = ins.map(function(x){ return '<button class="chip '+(S.qplate===x.p?"on":"")+'" data-p="'+x.p+'">'+x.p+'</button>'; }).join("") || '<p class="sub">Chưa có xe củ mì IN trong bãi.</p>';
      var rows = IMP.map(function(name,i){ return '<div class="row" style="align-items:center;justify-content:space-between"><span>'+name+'</span><span><button class="ghost" data-i="'+i+'" data-d="-1">−</button> '+(S.imp[i]||0)+'% <button class="ghost" data-i="'+i+'" data-d="1">+</button></span></div>'; }).join("");
      var tot = S.imp.reduce(function(a,b){return a+b;},0);
      desk.innerHTML='<div class="card"><p class="kicker">RS232 · không sửa được</p><div class="num">'+S.starch.toFixed(1)+'%</div><p class="sub">COM3 mô phỏng. Chỉ củ mì nguyên liệu.</p><div class="row" style="margin-top:10px">'+chips+'</div></div>'+
        '<div class="card" style="margin-top:12px"><p class="kicker">Trừ tạp chất</p>'+rows+'<p class="warn">Tổng trừ '+tot.toFixed(1)+'%</p>'+
        '<div class="grid two" style="margin-top:10px"><label>Xác nhận tài xế<input id="ds" value="'+S.dsig+'"></label><label>Xác nhận chủ xe<input id="os" value="'+S.osig+'"></label></div>'+
        '<button class="gold" id="saveq" style="margin-top:12px">Gán điểm vào xe</button></div>';
      desk.querySelectorAll(".chip").forEach(function(b){ b.onclick=function(){ S.qplate=b.getAttribute("data-p"); render(); }; });
      desk.querySelectorAll("[data-i]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-i"); S.imp[i]=Math.max(0,Math.min(15,(S.imp[i]||0)+(+b.getAttribute("data-d")))); render(); }; });
      document.getElementById("saveq").onclick=function(){
        S.dsig=document.getElementById("ds").value.trim();
        S.osig=document.getElementById("os").value.trim();
        if(!S.qplate){ alert("Chọn xe củ mì."); return; }
        if(!S.dsig||!S.osig){ alert("Cần xác nhận tài xế và chủ xe."); return; }
        S.sessions.forEach(function(x){ if(x.p===S.qplate){ x.starch=S.starch; x.imp=tot; }});
        alert("Đã gán "+S.starch+"% / trừ "+tot+"% → "+S.qplate);
        render();
      };
    }
    function deskDay(desk){
      var rows = S.sessions.map(function(x){ return "<tr><td>"+x.t+"</td><td>"+x.p+"</td><td>"+x.d+"</td><td>"+x.kg.toLocaleString("vi-VN")+"</td><td>"+x.cargo+"</td><td>"+(x.starch||"—")+"</td></tr>"; }).join("") || "<tr><td colspan='6'>Chưa có phiên.</td></tr>";
      desk.innerHTML='<div class="row"><div class="card kpi"><span class="sub">Tấn vào</span><b>'+tons("IN")+'</b></div><div class="card kpi"><span class="sub">Tấn ra</span><b>'+tons("OUT")+'</b></div><div class="card kpi"><span class="sub">Phiên</span><b>'+S.sessions.length+'</b></div></div>'+
        '<div class="card" style="margin-top:12px"><table><thead><tr><th>Giờ</th><th>Biển</th><th></th><th>Kg</th><th>Hàng</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table><button class="gold" id="csv" style="margin-top:12px">Xuất CSV cuối ngày</button></div>';
      document.getElementById("csv").onclick=exportCsv;
    }
    setInterval(function(){ S.starch=Number((27.4+Math.random()*1.8).toFixed(1)); if(S.unlocked && S.tab==="q") render(); }, 2500);
    render();
  </script>
</body>
</html>
